# Cuts a release from a tag: build → sign (Developer ID) → DMG → notarize → staple →
# EdDSA-sign for Sparkle → publish, with the appcast attached to the same release. The app's
# SUFeedURL points at releases/latest/download/appcast.xml, so GitHub serves every byte.
#
# Required repository secrets (see docs/RELEASING.md):
#   DEVELOPER_ID_P12 / DEVELOPER_ID_P12_PASSWORD   Developer ID Application cert, base64 of the .p12
#   APPLE_ID / APPLE_TEAM_ID / APPLE_APP_PASSWORD  notarytool credentials (app-specific password)
#   SPARKLE_PRIVATE_KEY                            EdDSA private key from Sparkle's generate_keys
#   SPARKLE_PUBLIC_KEY                             its public half; baked into Info.plist
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.2.0)"
        required: true

permissions:
  contents: write

env:
  # one definition: the app is built against this and the appcast advertises it
  FEED_URL: ${{ vars.SU_FEED_URL || 'https://github.com/darrinm/kalendar/releases/latest/download/appcast.xml' }}

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: version
        run: |
          version="${{ github.event.inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "building $version"

      - name: Import signing certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          # a throwaway keychain so the runner's default keychain is never unlocked
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build and bundle
        env:
          KALENDAR_VERSION: ${{ steps.version.outputs.version }}
          KALENDAR_BUILD: ${{ github.run_number }}
          KALENDAR_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
          KALENDAR_FEED_URL: ${{ env.FEED_URL }}
        run: bash scripts/bundle.sh

      - name: Verify the signature is Developer ID and hardened
        run: |
          codesign --verify --deep --strict --verbose=2 dist/Kalendar.app
          codesign -dvvv dist/Kalendar.app 2>&1 | grep -q "Developer ID Application" \
            || { echo "not signed with Developer ID"; exit 1; }
          # Kalendar ships with no entitlements; one appearing means the signing step changed
          ! codesign -d --entitlements - --xml dist/Kalendar.app 2>/dev/null | grep -q "<key>" \
            || { echo "unexpected entitlements on the app"; exit 1; }

      - name: Build DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          staging="$RUNNER_TEMP/dmg"
          mkdir -p "$staging"
          cp -R dist/Kalendar.app "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "Kalendar" -srcfolder "$staging" -ov -format UDZO dist/Kalendar.dmg
          # sign the disk image itself, not just the app inside it: Gatekeeper assesses what the
          # user actually double-clicks, and an unsigned image is "no usable signature" to spctl
          # even after it has been notarized and stapled.
          # bundle.sh already chose an identity and recorded it; re-deriving it here risked the
          # app and the image being signed by different certificates.
          identity=$(cat dist/.sign-identity)
          [ -n "$identity" ] || { echo "bundle.sh recorded no signing identity"; exit 1; }
          codesign --force --timestamp --sign "$identity" dist/Kalendar.dmg
          codesign --verify --verbose dist/Kalendar.dmg

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit dist/Kalendar.dmg \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PASSWORD" \
            --wait --timeout 30m
          xcrun stapler staple dist/Kalendar.dmg
          # Gatekeeper's own verdict, so a broken notarization fails here and not on a friend's Mac
          spctl -a -t open --context context:primary-signature -vv dist/Kalendar.dmg

      - name: Sign the update for Sparkle
        id: sign
        env:
          PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          # not old_dsa_scripts/sign_update — that one signs with the legacy DSA key Sparkle
          # no longer verifies, and it sits right next to the EdDSA tool
          sign_update=$(find .build/artifacts -type f -name sign_update -not -path "*old_dsa_scripts*" | head -1)
          [ -n "$sign_update" ] || { echo "sign_update not found in the Sparkle artifact"; exit 1; }
          echo "$PRIVATE_KEY" > "$RUNNER_TEMP/eddsa.key"
          # prints e.g. sparkle:edSignature="…" length="…"
          attrs=$("$sign_update" dist/Kalendar.dmg -f "$RUNNER_TEMP/eddsa.key")
          rm "$RUNNER_TEMP/eddsa.key"
          echo "attrs=$attrs" >> "$GITHUB_OUTPUT"

      - name: Write appcast
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ github.run_number }}
          ATTRS: ${{ steps.sign.outputs.attrs }}
          # a fork's appcast has to point at the fork's own releases and its own feed URL,
          # or its users would be updated from someone else's builds
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          # one entry, always pointing at this release's asset: Sparkle only needs the newest
          cat > dist/appcast.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Kalendar</title>
              <link>$FEED_URL</link>
              <description>Updates for Kalendar</description>
              <language>en</language>
              <item>
                <title>Version $VERSION</title>
                <pubDate>$(date -u "+%a, %d %b %Y %H:%M:%S +0000")</pubDate>
                <sparkle:version>$BUILD</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
                <link>$SERVER/$REPO/releases/tag/v$VERSION</link>
                <enclosure url="$SERVER/$REPO/releases/download/v$VERSION/Kalendar.dmg"
                           type="application/octet-stream" $ATTRS />
              </item>
            </channel>
          </rss>
          XML
          python3 -c "import xml.dom.minidom,sys; xml.dom.minidom.parse('dist/appcast.xml')"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" --title "Kalendar $VERSION" --generate-notes \
            dist/Kalendar.dmg dist/appcast.xml \
            || gh release upload "v$VERSION" dist/Kalendar.dmg dist/appcast.xml --clobber
